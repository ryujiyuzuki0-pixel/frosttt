# Legacy: copy the bundled model into plugins/MythicArmors/models/ and run "ma reload".
# The plugin renders the armor itself now, so leave this off (MythicArmors would draw it a second time).
install-model: false

# Used when /frost give doesn't specify leather/netherite
default-base: netherite

# Built-in resource pack host. Serves the pack MythicArmors generates and sends it
# to every player on join (and again whenever pack.zip is rebuilt).
# Turn off if Nexo/Oraxen/ItemsAdder already host a pack that includes pack.zip.
pack:
  enabled: true
  # EASIEST: players download from this URL instead of your server, so NO port needs opening.
  # The GitHub build fills in REPO_SLUG automatically (release asset "pack.zip"). Works on any
  # host (Aternos, shared panels...). Repo must be public. Leave blank to self-host instead.
  external-url: "https://github.com/REPO_SLUG/releases/download/latest/pack.zip"
  # Self-host only (ignored when external-url is set): TCP port players download from. MUST be open/forwarded on your host.
  port: 8123
  # "auto" = detect the server's public IP on startup. Or set a full URL, e.g.
  # "http://play.example.com:8123/pack.zip" (behind a proxy/domain).
  public-url: auto
  # Legacy: serve MythicArmors' own pack.zip instead of the bundled one
  use-mythicarmor: false
  # Path relative to the plugins folder (only used with use-mythicarmor)
  file: "MythicArmors/pack.zip"
  # true = players are kicked if they decline the pack
  required: false
  prompt: "<#C8C4E0>Reforged Frost resource pack"

# Armor set bonuses (amplifier 0 = Speed I, 1 = Speed II)
set-bonus:
  # 1-3 pieces worn
  partial-speed-amplifier: 0
  # all 4 pieces worn
  full-speed-amplifier: 1
  # all 4 pieces worn: extra max health as a fraction (0.05 = +5% = 21 HP instead of 20, 0 = off)
  full-health-bonus: 0.05

# Armor animation (the 3D parts are display entities that follow the player)
animation:
  enabled: true
  # arm / leg swing while walking. 1.0 = exactly like the vanilla armor layer (arms about 57 deg, legs 80 deg
  # at a sprint). Lower it for a calmer look.
  swing-scale: 1.0
  # forward lean of the upper body while sneaking
  sneak-lean-degrees: 26
  # floating dust cubes around the chest slowly orbit and bob
  dust: true
  # What the wearer sees of their OWN armor by default (others always see everything):
  #   first = helmet, chest and arms are hidden from you so they do not block the first-person camera
  #   third = everything is visible (use this if you mostly play in third person)
  # Each player can switch with /frost view; the choice is remembered.
  own-view: first
  # Sneak + F (swap hands) switches the view above while you wear the armor; the F swap is cancelled then.
  sneak-f-toggle: true
